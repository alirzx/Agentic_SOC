id: splunk
name: Splunk SIEM Connector
version: "1.1.0"
plugin_type: connector
tier: stable
description: >
  Pull notable events or ES correlation-search catalog from Splunk Enterprise /
  Splunk Cloud via the REST API (management port 8089). Auth supports Bearer
  token or Basic username/password. Urgency / ES severity (1-5) maps onto the
  five-tier ladder (info|low|medium|high|critical). Optional custom_search runs
  ad-hoc SPL (e.g. ES correlationsearch.enabled=1 catalog). Events flow:
  connector → ingest → Kafka → fusion → dashboard.
author: AiSOC Core Team
tags: [siem, splunk, connector, notables, enterprise-security]
homepage: https://github.com/SoorinSecurity/Agentic_SOC/tree/main/services/connectors/app/connectors/splunk.py
license: MIT
min_aisoc_version: "7.0.0"
config_schema:
  type: object
  required: [base_url]
  properties:
    base_url:
      type: string
      description: Splunk management URL (port 8089), e.g. https://splunk.example.com:8089
    token:
      type: string
      secret: true
      description: Optional Bearer token; leave blank when using username/password
    username:
      type: string
      description: Basic auth username (used when token is empty)
    password:
      type: string
      secret: true
      description: Basic auth password (used when token is empty)
    saved_search:
      type: string
      default: ""
      description: Named saved search to dispatch; ignored when custom_search is set
    custom_search:
      type: string
      default: "search index=notable | table _time source search_name severity urgency host dvc dest dest_port transport src src_ip source_guid source_event_id event_id _cd _raw"
      description: Fired notables from index=notable (prefer over ES catalog |rest)
    earliest_time:
      type: string
      default: "-90d@d"
      description: Splunk earliest_time window
    page_size:
      type: number
      default: 500
      description: Results page size
    ssl_verify:
      type: boolean
      default: false
      description: Verify TLS; leave false for lab self-signed certs
