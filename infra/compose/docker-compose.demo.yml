###############################################################################
# AiSOC - AI Security Operations Center
# Docker Compose - Slim Demo Profile (time-to-wow under 5 minutes)
#
# This profile pulls prebuilt images from GHCR instead of building locally.
# Core UI stack: postgres, redis, zookeeper, kafka, api, agents, realtime, web
# Live ingest spine (required for Connectors → Test / Splunk): ingest-worker,
# fusion, connectors. Without connectors, POST .../connectors/{id}/test → 503.
#
# Optional heavyweights (clickhouse, opensearch, qdrant, neo4j, …) stay out.
# `pnpm aisoc:splunk` also loads docker-compose.splunk.yml (live-mode web).
# Demo seed is opt-in via `--profile demo-seed`.
#
# Usage:
#   pnpm aisoc:splunk          # live ingest spine, no seed
#   pnpm aisoc:demo --seed     # classic seeded demo
#   pnpm aisoc:purge-demo      # wipe leftover INC-RT-* / DEMO-* rows
#
# Manual usage (always pin project-directory so repo-root `.env` is loaded):
#   docker compose --project-directory . -f infra/compose/docker-compose.demo.yml pull
#   docker compose --project-directory . -f infra/compose/docker-compose.demo.yml up -d
#
# SECURITY NOTE
# -------------
# Application ports (web / api / agents / realtime) bind to
# ${AISOC_BIND_ADDR:-0.0.0.0} so the console is reachable on the LAN
# (e.g. http://192.168.0.55:5000). Postgres / Redis / Kafka stay on
# 127.0.0.1 with non-default host ports (15432 / 16379 / 19092) so they
# do not collide with system Postgres/Redis. To lock the UI back to
# localhost only:
#   AISOC_BIND_ADDR=127.0.0.1 docker compose ... up -d
# If you expose this beyond a trusted network, change the demo passwords.
###############################################################################

name: aisoc-demo

networks:
  aisoc-demo:
    driver: bridge

volumes:
  postgres_demo_data:
  redis_demo_data:
  kafka_demo_data:

services:
  # ─── Infrastructure ─────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: aisoc-demo-postgres
    environment:
      POSTGRES_DB: aisoc
      POSTGRES_USER: aisoc
      POSTGRES_PASSWORD: aisoc_dev_secret
    # Host port defaults away from 5432 so system Postgres does not block
    # the demo. Override with AISOC_POSTGRES_PORT. Container stays on 5432.
    ports:
      - "127.0.0.1:${AISOC_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_demo_data:/var/lib/postgresql/data
    networks:
      - aisoc-demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aisoc"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aisoc-demo-redis
    command: redis-server --appendonly yes --requirepass redis_dev_secret
    ports:
      - "127.0.0.1:${AISOC_REDIS_PORT:-16379}:6379"
    volumes:
      - redis_demo_data:/data
    networks:
      - aisoc-demo
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_dev_secret", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: aisoc-demo-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - aisoc-demo
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: aisoc-demo-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AISOC_KAFKA_PORT:-19092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Listeners MUST be explicit: internal 29092 (docker DNS) + host 9092
      # (published as AISOC_KAFKA_PORT). Without KAFKA_LISTENERS the broker
      # exits on startup when ADVERTISED points at 29092.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${AISOC_KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: -Xmx512M -Xms256M
    networks:
      - aisoc-demo
    volumes:
      - kafka_demo_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ─── Application Services (prebuilt from GHCR) ──────────────────────────────

  api:
    image: ghcr.io/beenuar/aisoc-core-api:${AISOC_TAG:-latest}
    # Local build context for `pnpm aisoc:demo --rebuild` / `pnpm aisoc:splunk`.
    # Paths are relative to `--project-directory` (repo root), not this file.
    build:
      context: services/api
    container_name: aisoc-demo-api
    # `missing` lets `pnpm aisoc:demo --rebuild` use locally built images
    # without being clobbered by a registry pull. Compose still pulls when
    # the image isn't present locally (first run) or when the user runs
    # `docker compose pull` explicitly.
    pull_policy: missing
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "${AISOC_BIND_ADDR:-0.0.0.0}:${AISOC_API_PORT:-8888}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://aisoc:aisoc_dev_secret@postgres:5432/aisoc
      REDIS_URL: redis://:redis_dev_secret@redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SECRET_KEY: dev_secret_key_change_in_production
      ENV: development
      ENVIRONMENT: development
      LOG_LEVEL: info
      # Browser → api CORS origin tracks the web host port so a fallback
      # publish (e.g. 3001) still passes the api's CORS preflight when a
      # caller hits the api directly.
      CORS_ORIGINS: ${AISOC_CORS_ORIGINS:-http://localhost:5000,http://127.0.0.1:5000}
      # The agents service listens on port 8084 inside the Docker network
      # (see its Dockerfile + the agents service block below). Without this
      # the api defaults to `http://agents:8000` and every playbook / case
      # investigation request 503s with "All connection attempts failed".
      AGENTS_SERVICE_URL: http://agents:8084
      # Click-and-connect Test / catalog proxy (splunk overlay brings this up).
      CONNECTORS_SERVICE_URL: http://connectors:8003
      # Proxy /api/v1/fusion/* entity-risk to the live fusion service.
      FUSION_SERVICE_URL: http://fusion:8003
      # Shared Fernet key with the connectors service (vault encrypt/decrypt).
      AISOC_CREDENTIAL_KEY: ${AISOC_CREDENTIAL_KEY:-tchVA6r43RGw2KPHtiwB3iKVd_pxWyp10XZTFgyOWOI=}
      AISOC_CREDENTIAL_KEY_ROTATION_FROM: ${AISOC_CREDENTIAL_KEY_ROTATION_FROM:-}
    networks:
      - aisoc-demo
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c ''import urllib.request; urllib.request.urlopen("http://localhost:8000/health")'' || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  agents:
    image: ghcr.io/beenuar/aisoc-agents:${AISOC_TAG:-latest}
    build:
      context: services/agents
    container_name: aisoc-demo-agents
    pull_policy: missing
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${AISOC_BIND_ADDR:-0.0.0.0}:${AISOC_AGENTS_PORT:-8887}:8084"
    environment:
      DATABASE_URL: postgresql+asyncpg://aisoc:aisoc_dev_secret@postgres:5432/aisoc
      REDIS_URL: redis://:redis_dev_secret@redis:6379/4
      CORE_API_URL: http://api:8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # Issue #478 — the slim demo runs without the LiteLLM gateway, so pin every
      # task role to a concrete provider model (AiSOC calls the provider directly
      # with OPENAI_API_KEY; deterministic fallback when no key is set). The full
      # stack (root docker-compose.yml) routes these aliases through the gateway.
      AISOC_MODEL_PIN_TRIAGE: ${OPENAI_MODEL:-gpt-4o-mini}
      AISOC_MODEL_PIN_RECON: ${OPENAI_MODEL:-gpt-4o-mini}
      AISOC_MODEL_PIN_INVESTIGATION: ${OPENAI_MODEL:-gpt-4o-mini}
      AISOC_MODEL_PIN_COPILOT: ${OPENAI_MODEL:-gpt-4o-mini}
      AISOC_MODEL_PIN_SUMMARY: ${OPENAI_MODEL:-gpt-4o-mini}
      AISOC_MODEL_PIN_REPORT: ${OPENAI_MODEL:-gpt-4o-mini}
      AISOC_MODEL_PIN_NL: ${OPENAI_MODEL:-gpt-4o-mini}
      ENV: development
    networks:
      - aisoc-demo
    restart: unless-stopped

  realtime:
    image: ghcr.io/beenuar/aisoc-realtime:${AISOC_TAG:-latest}
    build:
      context: services/realtime
    container_name: aisoc-demo-realtime
    pull_policy: missing
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "${AISOC_BIND_ADDR:-0.0.0.0}:${AISOC_REALTIME_PORT:-8086}:4000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://:redis_dev_secret@redis:6379
      REDIS_PASSWORD: redis_dev_secret
      PORT: 4000
    networks:
      - aisoc-demo
    restart: unless-stopped

  # ─── Live ingest spine (Connectors → Test / Splunk poll → alerts) ───────────
  # Without these, POST /api/v1/connectors/{id}/test returns 503 because the
  # API proxies to http://connectors:8003.

  ingest-worker:
    image: ghcr.io/beenuar/aisoc-ingest:${AISOC_TAG:-latest}
    build:
      context: services/ingest
    container_name: aisoc-demo-ingest
    pull_policy: missing
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AISOC_INGEST_PORT:-18081}:8080"
    environment:
      ENV: development
      HTTP_PORT: 8080
      METRICS_PORT: 9090
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://:redis_dev_secret@redis:6379/1
      LOG_LEVEL: info
      JWT_SECRET: ${SECRET_KEY:-dev_secret_key_change_in_production}
      AISOC_GRAPH_ENABLED: "false"
    networks:
      - aisoc-demo
    restart: unless-stopped

  fusion:
    image: ghcr.io/beenuar/aisoc-fusion:${AISOC_TAG:-latest}
    build:
      context: services/fusion
    container_name: aisoc-demo-fusion
    pull_policy: missing
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AISOC_FUSION_PORT:-18003}:8003"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://:redis_dev_secret@redis:6379/3
      DATABASE_URL: postgresql+asyncpg://aisoc:aisoc_dev_secret@postgres:5432/aisoc
      CLICKHOUSE_HOST: ""
      AISOC_LAKE_WRITER_ENABLED: "false"
      KAFKA_AUTO_OFFSET_RESET: earliest
      KAFKA_CONSUMER_GROUP: aisoc-fusion-consumer-demo-v3
    networks:
      - aisoc-demo
    restart: unless-stopped

  connectors:
    image: ghcr.io/beenuar/aisoc-connectors:${AISOC_TAG:-latest}
    build:
      context: services/connectors
    container_name: aisoc-demo-connectors
    pull_policy: missing
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ingest-worker:
        condition: service_started
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AISOC_CONNECTORS_PORT:-18088}:8003"
    environment:
      PORT: "8003"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://:redis_dev_secret@redis:6379/6
      DATABASE_URL: postgresql+asyncpg://aisoc:aisoc_dev_secret@postgres:5432/aisoc
      CORE_API_URL: http://api:8000
      INGEST_SERVICE_URL: http://ingest-worker:8080
      AISOC_CREDENTIAL_KEY: ${AISOC_CREDENTIAL_KEY:-tchVA6r43RGw2KPHtiwB3iKVd_pxWyp10XZTFgyOWOI=}
      AISOC_CREDENTIAL_KEY_ROTATION_FROM: ${AISOC_CREDENTIAL_KEY_ROTATION_FROM:-}
    networks:
      - aisoc-demo
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c ''import urllib.request; urllib.request.urlopen("http://localhost:8003/livez")'' || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ─── One-shot demo seeder (opt-in) ──────────────────────────────────────────
  # Disabled by default so dashboards stay empty until a real connector
  # (e.g. Splunk) ingests live data. Enable with:
  #   docker compose ... --profile demo-seed up -d
  # or `pnpm aisoc:demo --seed`.
  seed:
    profiles: ["demo-seed"]
    image: ghcr.io/beenuar/aisoc-core-api:${AISOC_TAG:-latest}
    build:
      context: services/api
    container_name: aisoc-demo-seed
    pull_policy: missing
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://aisoc:aisoc_dev_secret@postgres:5432/aisoc
      REDIS_URL: redis://:redis_dev_secret@redis:6379/0
      SECRET_KEY: dev_secret_key_change_in_production
      ENV: development
      ENVIRONMENT: development
      LOG_LEVEL: info
      AISOC_DISABLE_KAFKA: "true"
    networks:
      - aisoc-demo
    restart: "no"
    command: ["python", "-m", "app.scripts.seed_demo"]

  # Bootstrap tenant + login user only (no fake alerts/cases). Used by live
  # Splunk bring-up so operators can sign in without seeding demo incidents.
  bootstrap:
    profiles: ["bootstrap"]
    image: ghcr.io/beenuar/aisoc-core-api:${AISOC_TAG:-latest}
    build:
      context: services/api
    container_name: aisoc-demo-bootstrap
    pull_policy: missing
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://aisoc:aisoc_dev_secret@postgres:5432/aisoc
      REDIS_URL: redis://:redis_dev_secret@redis:6379/0
      SECRET_KEY: dev_secret_key_change_in_production
      ENV: development
      ENVIRONMENT: development
      LOG_LEVEL: info
      AISOC_DISABLE_KAFKA: "true"
    networks:
      - aisoc-demo
    restart: "no"
    command: ["python", "-m", "app.scripts.seed_demo", "--bootstrap-only"]

  web:
    image: ghcr.io/beenuar/aisoc-web:${AISOC_TAG:-latest}
    # Build context for `pnpm aisoc:demo --rebuild`. The Dockerfile bakes the
    # frontend bundle with empty NEXT_PUBLIC_* defaults so every fetch is a
    # same-origin relative path (`/api/v1/...`, `/ws/...`). Next.js then
    # proxies those to the services below using the Docker DNS targets in
    # `environment:`.
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Next.js bakes rewrite destinations into routes-manifest.json at
      # `next build` time, not at `next start`. These args MUST match the
      # Docker DNS hostnames the runtime environment resolves to, otherwise
      # the proxy layer ECONNREFUSEs to localhost from inside the container.
      args:
        API_URL: http://api:8000
        AGENTS_URL: http://agents:8084
        REALTIME_URL: http://realtime:4000
        FUSION_URL: http://fusion:8003
        # NEXT_PUBLIC_* left empty for live Splunk mode (no demo banner/auto-login).
        NEXT_PUBLIC_DEMO_MODE: ""
        NEXT_PUBLIC_DEMO_DEEPLINK: ""
        NEXT_PUBLIC_DEMO_BANNER: ""
        NEXT_PUBLIC_DEMO_AUTOLOGIN_EMAIL: ""
        NEXT_PUBLIC_DEMO_AUTOLOGIN_PASSWORD: ""
    container_name: aisoc-demo-web
    pull_policy: missing
    depends_on:
      - api
      - agents
      - realtime
      - fusion
    ports:
      - "${AISOC_BIND_ADDR:-0.0.0.0}:${AISOC_WEB_PORT:-5000}:3000"
    environment:
      # Server-side rewrite targets (used by the Next.js Node process).
      # These never reach the browser — only the proxy layer in next.config.js.
      API_URL: http://api:8000
      AGENTS_URL: http://agents:8084
      REALTIME_URL: http://realtime:4000
      FUSION_URL: http://fusion:8003
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    # Force listen port inside the container to 3000 regardless of
    # apps/web/package.json "start" script (host 5000 maps to this).
    command: ["pnpm", "exec", "next", "start", "-H", "0.0.0.0", "-p", "3000"]
    networks:
      - aisoc-demo
    restart: unless-stopped
