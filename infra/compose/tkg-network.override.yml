# Server 55 demo project. Mount role-specific operator-managed secret directories.
services:
  api:
    networks: [aisoc_tkg]
    environment:
      AISOC_TKG_ORIGIN_SERVER55: ${AISOC_TKG_ORIGIN_SERVER55:-http://soorin-tkg:1516}
    volumes:
      - type: bind
        source: ${AISOC_TKG_READER_DIR:-/etc/aisoc/tkg/reader}
        target: /run/secrets/tkg/reader
        read_only: true
        bind: {create_host_path: false}
  agents:
    networks: [aisoc_tkg]
    environment:
      AISOC_TKG_ORIGIN_SERVER55: ${AISOC_TKG_ORIGIN_SERVER55:-http://soorin-tkg:1516}
      AISOC_TKG_RECON_ENABLED: ${AISOC_TKG_RECON_ENABLED:-false}
      AISOC_TKG_RECON_PREFLIGHT_ENABLED: ${AISOC_TKG_RECON_PREFLIGHT_ENABLED:-true}
      AISOC_TKG_RECON_LOOP_ENABLED: ${AISOC_TKG_RECON_LOOP_ENABLED:-false}
      AISOC_TKG_RECON_PROFILE: ${AISOC_TKG_RECON_PROFILE:-standard}
      AISOC_TKG_RECON_MAX_ITERATIONS: ${AISOC_TKG_RECON_MAX_ITERATIONS:-}
      AISOC_TKG_RECON_MAX_LLM_CALLS: ${AISOC_TKG_RECON_MAX_LLM_CALLS:-}
      AISOC_TKG_RECON_MAX_TOOL_CALLS: ${AISOC_TKG_RECON_MAX_TOOL_CALLS:-}
      AISOC_TKG_RECON_MAX_TRANSPORT_REQUESTS: ${AISOC_TKG_RECON_MAX_TRANSPORT_REQUESTS:-}
      AISOC_TKG_RECON_MAX_PLANNER_OUTPUT_TOKENS: ${AISOC_TKG_RECON_MAX_PLANNER_OUTPUT_TOKENS:-}
      AISOC_TKG_RECON_MAX_ASSESSMENT_OUTPUT_TOKENS: ${AISOC_TKG_RECON_MAX_ASSESSMENT_OUTPUT_TOKENS:-}
      AISOC_TKG_RECON_MAX_MODEL_TOKENS: ${AISOC_TKG_RECON_MAX_MODEL_TOKENS:-}
      AISOC_TKG_RECON_MAX_COST_USD: ${AISOC_TKG_RECON_MAX_COST_USD:-}
      AISOC_TKG_RECON_TIMEOUT_SECONDS: ${AISOC_TKG_RECON_TIMEOUT_SECONDS:-}
      AISOC_TKG_RECON_TOOL_TIMEOUT_SECONDS: ${AISOC_TKG_RECON_TOOL_TIMEOUT_SECONDS:-}
      AISOC_TKG_RECON_SEARCH_TIMEOUT_SECONDS: ${AISOC_TKG_RECON_SEARCH_TIMEOUT_SECONDS:-}
      AISOC_TKG_RECON_PLANNER_TIMEOUT_SECONDS: ${AISOC_TKG_RECON_PLANNER_TIMEOUT_SECONDS:-}
      AISOC_TKG_RECON_ASSESSMENT_TIMEOUT_SECONDS: ${AISOC_TKG_RECON_ASSESSMENT_TIMEOUT_SECONDS:-}
      AISOC_TKG_RECON_HISTORY_CONTEXT_TOKENS: ${AISOC_TKG_RECON_HISTORY_CONTEXT_TOKENS:-}
      AISOC_TKG_RECON_SEMANTIC_EXCERPT_CHARS: ${AISOC_TKG_RECON_SEMANTIC_EXCERPT_CHARS:-}
      AISOC_TKG_RECON_MAX_CASE_SEEDS: ${AISOC_TKG_RECON_MAX_CASE_SEEDS:-}
    volumes:
      - type: bind
        source: ${AISOC_TKG_READER_DIR:-/etc/aisoc/tkg/reader}
        target: /run/secrets/tkg/reader
        read_only: true
        bind: {create_host_path: false}
  tkg-sync:
    profiles: [tkg-sync]
    image: ghcr.io/beenuar/aisoc-core-api:${AISOC_TAG:-latest}
    build: {context: services/api}
    command: [python, -m, app.services.tkg.worker, run]
    restart: on-failure
    networks: [aisoc-demo, aisoc_tkg]
    mem_limit: 256m
    cpus: 0.5
    environment:
      DATABASE_URL: ${AISOC_TKG_WORKER_DATABASE_URL:-}
      AISOC_TKG_ORIGIN_SERVER55: ${AISOC_TKG_ORIGIN_SERVER55:-http://soorin-tkg:1516}
      AISOC_TKG_AUTO_INGEST_ENABLED: ${AISOC_TKG_AUTO_INGEST_ENABLED:-false}
    volumes:
      - type: bind
        source: ${AISOC_TKG_INGEST_DIR:-/etc/aisoc/tkg/ingest}
        target: /run/secrets/tkg/ingest
        read_only: true
        bind: {create_host_path: false}
  tkg-reconcile:
    profiles: [tkg-sync]
    image: ghcr.io/beenuar/aisoc-core-api:${AISOC_TAG:-latest}
    build: {context: services/api}
    command: [python, -m, app.services.tkg.reconcile]
    restart: on-failure
    networks: [aisoc-demo, aisoc_tkg]
    mem_limit: 192m
    cpus: 0.25
    environment:
      AISOC_TKG_ORIGIN_SERVER55: ${AISOC_TKG_ORIGIN_SERVER55:-http://soorin-tkg:1516}
      AISOC_TKG_RECONCILE_DATABASE_URL: ${AISOC_TKG_RECONCILE_DATABASE_URL:-}
      AISOC_TKG_RECONCILE_ENABLED: ${AISOC_TKG_RECONCILE_ENABLED:-false}
      AISOC_TKG_RECONCILE_INTERVAL_SECONDS: ${AISOC_TKG_RECONCILE_INTERVAL_SECONDS:-30}
      AISOC_TKG_RECONCILE_BATCH_SIZE: ${AISOC_TKG_RECONCILE_BATCH_SIZE:-30}
      AISOC_TKG_RECONCILE_CONCURRENCY: ${AISOC_TKG_RECONCILE_CONCURRENCY:-1}
      AISOC_TKG_RECONCILE_REQUEST_TIMEOUT_SECONDS: ${AISOC_TKG_RECONCILE_REQUEST_TIMEOUT_SECONDS:-10}
      AISOC_TKG_RECONCILE_PENDING_WARN_SECONDS: ${AISOC_TKG_RECONCILE_PENDING_WARN_SECONDS:-300}
      AISOC_TKG_RECONCILE_PENDING_ALERT_SECONDS: ${AISOC_TKG_RECONCILE_PENDING_ALERT_SECONDS:-1800}
    volumes:
      - type: bind
        source: ${AISOC_TKG_DIAGNOSTICS_DIR:-/etc/aisoc/tkg/diagnostics}
        target: /run/secrets/tkg/diagnostics
        read_only: true
        bind: {create_host_path: false}

networks:
  aisoc_tkg:
    external: true
    name: aisoc-tkg
