name: SOC TKG release checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyst-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm --filter '@aisoc/web...' install --frozen-lockfile
      - run: pnpm --filter @aisoc/web run type-check
      - run: pnpm --filter @aisoc/web exec vitest run src/components/cases/TkgHistoryView.test.tsx src/components/cases/CaseWorkspace.test.tsx src/components/alerts/InvestigationRail.test.tsx --maxWorkers=1
  api-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: services/api
    env:
      DEBUG: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install poetry==2.5.1
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 shared-mime-info
      - run: poetry install --no-root
      - run: poetry run python -m pip check
      - run: poetry run pytest -q tests/api/v1/test_tkg_knowledge.py tests/api/v1/test_tkg_polishing.py tests/test_investigation_run_summary.py tests/test_cases_tenant_isolation.py

  python-services:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: agents
            tests: tests/test_tkg_workspace_recon.py tests/test_alert_investigation_tenant_boundary.py tests/test_privacy_packaging_contract.py tests/test_canonical_tenant_privacy.py tests/test_runtime_llm_privacy.py tests/test_orchestrator_router_privacy.py tests/test_privacy_remote_rest_contract.py tests/test_privacy_final_ownership.py tests/test_claim_validation.py tests/test_fused_alert_worker.py tests/test_llm_ops.py::test_committed_prompt_lock_matches_registry
          - service: fusion
            tests: tests/test_alert_sink.py tests/test_deduplicator.py tests/test_alert_model.py
          - service: connectors
            tests: tests/test_splunk_connector.py tests/test_ingest_client.py tests/test_normalize_connector_config.py
          - service: correlation
            tests: tests/test_engine_db.py tests/test_rule_registry.py tests/test_rule_registry_db_rows.py
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    env:
      DEBUG: 'false'
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install poetry==2.5.1
      - run: poetry install --no-root
      - run: poetry run python -m pip check
      - run: poetry run pytest -q ${{ matrix.tests }}

  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/ingest/go.mod
          cache-dependency-path: services/ingest/go.sum
      - run: go test ./...
      - run: go build ./...

  realtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: services/realtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/realtime/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  deployment-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: bash -n scripts/server55_soc_build.sh
      - run: python -m py_compile scripts/qualify_tkg_compose.py
      - run: docker compose version
      - run: python -m pytest -q tests/test_server55_production_arguments.py -k 'not cross_repository'

  release-gate:
    runs-on: ubuntu-latest
    if: always()
    needs: [analyst-ui, api-contracts, python-services, ingest, realtime, deployment-config]
    steps:
      - name: Require all component checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json, os, sys; results=json.loads(os.environ["RESULTS"]); failed=[name for name, value in results.items() if value["result"] != "success"]; print("Unsuccessful jobs:", failed); sys.exit(bool(failed))'
