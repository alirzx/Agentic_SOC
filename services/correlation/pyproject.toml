[tool.poetry]
name = "aisoc-correlation"
version = "2.0.0"
description = "AiSOC graph correlation engine - llm_payload entity extraction, observation dedup, campaign case creation"
authors = ["AiSOC Community"]
license = "MIT"
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
asyncpg = "^0.30.0"
httpx = "^0.26.0"
structlog = "^24.1.0"
prometheus-client = "^0.19.0"
neo4j = "^5.14.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
ruff = "^0.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Ruff config lives in the repo-root `ruff.toml` so the CI gate is consistent
# across services. Don't add `[tool.ruff]` here — it would shadow the root.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "pragma: no cover - pragma: no cover",
]
